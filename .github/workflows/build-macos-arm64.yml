name: Build macOS arm64

on:
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: Build macOS arm64 dylib
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build_macos_arm64.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build arm64 libvosk.dylib
        run: ./build_macos_arm64.sh

      - name: Upload arm64 dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-arm64
          path: dist/macos/arm64/libvosk.dylib
          if-no-files-found: error
