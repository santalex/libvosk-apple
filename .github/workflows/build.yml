name: Build Vosk Apple Binaries & XCFramework

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      vosk_tag:
        description: 'Vosk API 上游 Tag 版本号 (例如: v0.3.45, v0.3.50；留空则默认编译最新 master)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apple-all:
    name: Build All Vosk Apple Binaries & XCFrameworks
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build all targets (macOS dylibs & Apple XCFrameworks)
        run: |
          if [ -n "${{ inputs.vosk_tag }}" ]; then
            export VOSK_TAG="${{ inputs.vosk_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            export VOSK_TAG="${GITHUB_REF_NAME}"
          fi
          ./build.sh all

      # ------------------------------------------------------------------------
      # Artifact 1: macOS x86_64 dylib
      # ------------------------------------------------------------------------
      - name: Upload macOS x86_64 dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-x86_64
          path: dist/macos/x86_64/libvosk.dylib

      # ------------------------------------------------------------------------
      # Artifact 2: macOS arm64 dylib
      # ------------------------------------------------------------------------
      - name: Upload macOS arm64 dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-arm64
          path: dist/macos/arm64/libvosk.dylib

      # ------------------------------------------------------------------------
      # Artifact 3: iOS XCFramework
      # ------------------------------------------------------------------------
      - name: Compress iOS XCFramework
        run: |
          cd dist/ios
          zip -r libvosk-ios-xcframework.zip libvosk.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-ios-xcframework
          path: dist/ios/libvosk-ios-xcframework.zip

      # ------------------------------------------------------------------------
      # Artifact 4: Apple All-in-One Super XCFramework (macOS + iOS)
      # ------------------------------------------------------------------------
      - name: Compress Apple Super XCFramework
        run: |
          cd dist/apple
          zip -r libvosk-apple-xcframework.zip libvosk.xcframework

      - name: Upload Apple Super XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-apple-xcframework
          path: dist/apple/libvosk-apple-xcframework.zip

      # ------------------------------------------------------------------------
      # Prepare Release Assets
      # ------------------------------------------------------------------------
      - name: Compress macOS dylib archives for Release
        run: |
          cd dist/macos/x86_64 && zip -r ../libvosk-macos-x86_64.zip libvosk.dylib && cd ../../..
          cd dist/macos/arm64 && zip -r ../libvosk-macos-arm64.zip libvosk.dylib && cd ../../..

      # ------------------------------------------------------------------------
      # Release Step 1: Specific Tag Release (For web input vosk_tag OR git tag v*)
      # ------------------------------------------------------------------------
      - name: Publish Tag Release
        if: inputs.vosk_tag != '' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.vosk_tag != '' && inputs.vosk_tag || github.ref_name }}
          name: "Vosk Apple ${{ inputs.vosk_tag != '' && inputs.vosk_tag || github.ref_name }}"
          files: |
            dist/macos/libvosk-macos-x86_64.zip
            dist/macos/libvosk-macos-arm64.zip
            dist/ios/libvosk-ios-xcframework.zip
            dist/apple/libvosk-apple-xcframework.zip

      # ------------------------------------------------------------------------
      # Release Step 2: Rolling Nightly Release (ONLY if NOT specifying vosk_tag AND running on master)
      # ------------------------------------------------------------------------
      - name: Rolling Master Release (Nightly / Latest)
        if: inputs.vosk_tag == '' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 自动清理旧的 nightly release 与 tag
          gh release delete nightly --cleanup-tag -y || true
          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

          # 全自动创建全新的 nightly Rolling Release 挂载附件
          gh release create nightly \
            dist/macos/libvosk-macos-x86_64.zip \
            dist/macos/libvosk-macos-arm64.zip \
            dist/ios/libvosk-ios-xcframework.zip \
            dist/apple/libvosk-apple-xcframework.zip \
            --title "Rolling Master Build (Latest)" \
            --notes "Automated rolling build from latest master branch." \
            --prerelease
