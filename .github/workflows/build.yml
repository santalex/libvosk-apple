name: Build Vosk Apple Binaries & XCFramework

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-apple-all:
    name: Build All Vosk Apple Binaries & XCFrameworks
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build all targets (macOS dylibs & Apple XCFrameworks)
        run: ./build.sh all

      # ------------------------------------------------------------------------
      # Upload Artifact 1: macOS x86_64 dylib
      # ------------------------------------------------------------------------
      - name: Upload macOS x86_64 dylib
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-x86_64
          path: dist/macos/x86_64/libvosk.dylib

      # ------------------------------------------------------------------------
      # Upload Artifact 2: macOS arm64 dylib
      # ------------------------------------------------------------------------
      - name: Upload macOS arm64 dylib
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-arm64
          path: dist/macos/arm64/libvosk.dylib

      # ------------------------------------------------------------------------
      # Upload Artifact 3: iOS XCFramework
      # ------------------------------------------------------------------------
      - name: Compress iOS XCFramework
        run: |
          cd dist/ios
          zip -r libvosk-ios-xcframework.zip libvosk.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-ios-xcframework
          path: dist/ios/libvosk-ios-xcframework.zip

      # ------------------------------------------------------------------------
      # Upload Artifact 4: Apple All-in-One Super XCFramework (macOS + iOS)
      # ------------------------------------------------------------------------
      - name: Compress Apple Super XCFramework
        run: |
          cd dist/apple
          zip -r libvosk-apple-xcframework.zip libvosk.xcframework

      - name: Upload Apple Super XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-apple-xcframework
          path: dist/apple/libvosk-apple-xcframework.zip

      # ------------------------------------------------------------------------
      # Automatic GitHub Release Publishing (Triggers only when pushing tags v*)
      # ------------------------------------------------------------------------
      - name: Compress macOS dylib archives for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist/macos/x86_64 && zip -r ../libvosk-macos-x86_64.zip libvosk.dylib && cd ../../..
          cd dist/macos/arm64 && zip -r ../libvosk-macos-arm64.zip libvosk.dylib && cd ../../..

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/macos/libvosk-macos-x86_64.zip
            dist/macos/libvosk-macos-arm64.zip
            dist/ios/libvosk-ios-xcframework.zip
            dist/apple/libvosk-apple-xcframework.zip
