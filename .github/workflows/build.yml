name: Build Vosk Apple Binaries & XCFramework

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-macos-x86:
    name: Build macOS x86_64 dylib
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build macOS x86_64 dylib
        run: ARCH=x86_64 ./build.sh macos

      - name: Upload macOS x86_64 dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-x86_64
          path: dist/macos/x86_64/libvosk.dylib
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS arm64 dylib
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build macOS arm64 dylib
        run: ARCH=arm64 ./build.sh macos

      - name: Upload macOS arm64 dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-macos-arm64
          path: dist/macos/arm64/libvosk.dylib
          if-no-files-found: error

  build-ios:
    name: Build iOS libvosk.xcframework
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build iOS libvosk.xcframework
        run: ./build.sh ios

      - name: Compress XCFramework Artifact
        run: |
          cd dist/ios
          zip -r libvosk-ios-xcframework.zip libvosk.xcframework

      - name: Upload iOS XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-ios-xcframework
          path: dist/ios/libvosk-ios-xcframework.zip
          if-no-files-found: error

  bundle-super-xcframework:
    name: Bundle All-in-One Super libvosk.xcframework
    runs-on: macos-latest
    needs: [build-macos-x86, build-macos-arm64, build-ios]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool sox gcc
          echo "/opt/homebrew/opt/libtool/libexec/gnubin" >> $GITHUB_PATH

      - name: Build All-in-One Super XCFramework (macOS + iOS)
        run: ./build.sh all

      - name: Compress Super XCFramework Artifact
        run: |
          cd dist/apple
          zip -r libvosk-apple-xcframework.zip libvosk.xcframework

      - name: Upload Super XCFramework Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-apple-xcframework
          path: dist/apple/libvosk-apple-xcframework.zip
          if-no-files-found: error
